name: Publish

# npm trusted publishing (OIDC): no NPM_TOKEN secret. The npm-side trust
# relationship is keyed on this file name (publish.yml) + environment "npm".
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - name: Tag matches package.json version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run check
      # The suite pins fake credentials itself; this also keeps IMDS off.
      - run: npm test
        env:
          AWS_EC2_METADATA_DISABLED: "true"
      - run: npm run build
      - name: Committed dist matches the build
        run: git diff --exit-code dist && test -z "$(git status --porcelain dist)"
      - run: npm publish --access public
