name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Lockfiles generated behind a local proxy or CodeArtifact leak unreachable URLs.
      - name: Lockfile resolves only from registry.npmjs.org
        run: "! grep -E '\"resolved\": \"' package-lock.json | grep -v 'https://registry.npmjs.org/'"
      - run: npm ci
      - run: npm run check
      # The suite pins fake credentials itself; this also keeps IMDS off.
      - run: npm test
        env:
          AWS_EC2_METADATA_DISABLED: "true"
      - run: npm run build
      - name: Committed dist matches the build
        run: git diff --exit-code dist && test -z "$(git status --porcelain dist)"
      - run: npm pack --dry-run
